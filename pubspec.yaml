name: muhsen_pilgrims_mobile
description: "Muhsen Pilgrims Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🌍 Localization (مهم جدًا)
  flutter_localizations:
    sdk: flutter

  # 🔁 State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # 🧭 Routing
  go_router: ^14.6.2

  # 🌐 Networking
  dio: ^5.7.0
  http: ^1.1.0
  internet_connection_checker: ^1.0.0+1
  dartz: ^0.10.1

  # 💾 Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # 📞 Phone Input
  intl_phone_field: ^3.2.0

  # 🍎 iOS Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ═══════════════════════════════════════════════════════════
  # 🔹 Fonts (Almarai – حسب التصميم)
  # ═══════════════════════════════════════════════════════════
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800

  # ═══════════════════════════════════════════════════════════
  # 🔹 Assets
  # ═══════════════════════════════════════════════════════════
  assets:
    - assets/images/
    
